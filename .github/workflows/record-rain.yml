name: Record Rain Watering

# Each morning, log a garden irrigation run for any recent day with more than an
# inch of rain in the garden's ZIP code (see src/rain.ts).
on:
  schedule:
    # 15:23 UTC is 7:23 AM PST / 8:23 AM PDT, after the previous day has ended.
    - cron: '23 15 * * *'
  workflow_dispatch:

jobs:
  record-rain:
    name: Record rain watering
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record rain watering
        run: pnpm record-rain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
